<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рулетка · Фонд Карпінських</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f3ec;--card:#ffffff;--ink:#12274a;--muted:#5d6b85;--line:#e1dccf;
  --blue:#0f3b8c;--gold:#f2b705;--gold-ink:#3a2c00;--shadow:0 10px 30px rgba(18,39,74,.12);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0b1630;--card:#122244;--ink:#f3efe3;--muted:#9fb0d0;--line:#243a68;--blue:#5a8cff;--gold:#f6c744;--gold-ink:#2a2000;--shadow:0 10px 30px rgba(0,0,0,.45)}
}
:root[data-theme="dark"]{--bg:#0b1630;--card:#122244;--ink:#f3efe3;--muted:#9fb0d0;--line:#243a68;--blue:#5a8cff;--gold:#f6c744;--gold-ink:#2a2000;--shadow:0 10px 30px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background-image:radial-gradient(circle at 15% 0%,rgba(242,183,5,.18),transparent 40%),radial-gradient(circle at 100% 20%,rgba(15,59,140,.14),transparent 45%)}
.flag{height:8px;background:linear-gradient(#0057b7 50%,#ffd700 50%)}
header{max-width:1000px;margin:0 auto;padding:18px 16px 6px;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;flex:none}
h1{font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.1;margin:0}
.sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
main{max-width:1000px;margin:0 auto;padding:10px 16px 28px;display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:820px){main{grid-template-columns:1.15fr .85fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.wheelbox{position:relative;width:100%;max-width:460px;aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;width:34px;height:44px;margin-left:-17px;transform-origin:50% 8px;z-index:3;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.pointer.tick{animation:tick .12s ease-out}
@keyframes tick{0%{transform:rotate(0)}40%{transform:rotate(-22deg)}100%{transform:rotate(0)}}
.hub{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#ffe27a,var(--gold) 55%,#c48f00);color:var(--gold-ink);font-weight:800;font-size:clamp(11px,3.2vw,15px);letter-spacing:.06em;
  box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 -3px 6px rgba(0,0,0,.2);z-index:2}
.hub:active{transform:translate(-50%,-50%) scale(.95)}
.hub:disabled{cursor:default;filter:saturate(.7)}
.glow{position:absolute;inset:-10px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .4s;
  box-shadow:0 0 0 4px var(--gold),0 0 40px 8px rgba(242,183,5,.55)}
.spinning .glow{opacity:1;animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 4px var(--gold),0 0 60px 16px rgba(242,183,5,.8)}}
.result{min-height:30px;font-family:Georgia,serif;font-size:20px;text-align:center}
h2{font-family:Georgia,serif;font-size:18px;margin:0 0 10px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
input[type=text]:focus{outline:2px solid var(--blue);outline-offset:1px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--blue);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.chips{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px;max-height:260px;overflow:auto}
.chip{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:14px;animation:pop .25s ease-out}
.chip i{width:10px;height:10px;border-radius:50%;flex:none}
.chip button{border:0;background:var(--line);color:var(--ink);width:22px;height:22px;border-radius:50%;cursor:pointer;line-height:1;font-size:14px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hist{margin:0;padding-left:18px;color:var(--muted);font-size:14px;max-height:120px;overflow:auto}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
footer{max-width:1000px;margin:0 auto;padding:0 16px 24px;font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(5,12,30,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:20px;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.dlg{background:var(--card);border-radius:22px;padding:26px 22px;max-width:380px;width:100%;text-align:center;border:2px solid var(--gold);animation:zoom .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes zoom{from{transform:scale(.5) rotate(-4deg);opacity:0}}
.dlg small{letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-size:12px}
.dlg .win{font-family:Georgia,serif;font-size:30px;margin:10px 0 18px;word-break:break-word}
.dlg .row{justify-content:center;flex-wrap:wrap}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
</style>
</head>
<body>
<div class="flag"></div>
<header>
  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
    <circle cx="24" cy="24" r="22" fill="#0f3b8c"/>
    <g stroke="#f2b705" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path d="M24 38V16"/><path d="M24 16c-5-1-7-5-6-9 5 0 7 4 6 9z" fill="#f2b705"/><path d="M24 16c5-1 7-5 6-9-5 0-7 4-6 9z" fill="#f2b705"/>
      <path d="M24 26c-5-1-7-4-6-8 5 0 7 3 6 8zM24 26c5-1 7-4 6-8-5 0-7 3-6 8z" fill="#f2b705"/>
      <path d="M24 34c-5-1-7-4-6-8 5 0 7 3 6 8zM24 34c5-1 7-4 6-8-5 0-7 3-6 8z" fill="#f2b705"/>
    </g>
  </svg>
  <div>
    <h1>Фонд Карпінських</h1>
    <div class="sub">Рулетка вибору</div>
  </div>
</header>

<main>
  <section class="card stage" id="stage">
    <div class="wheelbox">
      <div class="glow"></div>
      <svg class="pointer" id="ptr" viewBox="0 0 34 44"><path d="M17 44L2 14A16 16 0 1 1 32 14z" fill="#f2b705" stroke="#0f3b8c" stroke-width="3"/><circle cx="17" cy="14" r="5" fill="#0f3b8c"/></svg>
      <canvas id="cv"></canvas>
      <button class="hub" id="spin">КРУТИТИ</button>
    </div>
    <div class="result" id="result">Додайте варіанти та крутіть!</div>
  </section>

  <div style="display:grid;gap:18px">
    <section class="card">
      <h2>Ваші варіанти</h2>
      <div class="row">
        <input type="text" id="inp" placeholder="Напишіть варіант…" maxlength="40" autocomplete="off">
        <button class="btn" id="add">Додати</button>
      </div>
      <p class="hint">Можна вставити кілька через кому — вони додадуться окремо.</p>
      <ul class="chips" id="chips"></ul>
      <div class="tools">
        <button class="btn ghost" id="shuffle">Перемішати</button>
        <button class="btn ghost" id="clear">Очистити</button>
        <button class="btn ghost" id="sound">Звук: увімк.</button>
      </div>
    </section>
    <section class="card">
      <h2>Історія</h2>
      <ol class="hist" id="hist"><li>Поки порожньо</li></ol>
    </section>
  </div>
</main>
<footer>Неофіційна рулетка у стилі фонду. Дякуємо всім, хто допомагає ЗСУ.</footer>

<div class="modal" id="modal">
  <div class="dlg">
    <small>Рулетка обрала</small>
    <div class="win" id="win"></div>
    <div class="row">
      <button class="btn gold" id="again">Ще раз</button>
      <button class="btn ghost" id="drop">Прибрати цей варіант</button>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>

<script>
(function(){
  var COLORS=[["#0f3b8c","#fff"],["#f2b705","#3a2c00"],["#2f6fe0","#fff"],["#ffe08a","#3a2c00"],["#0a2a66","#fff"],["#c98f00","#fff"]];
  var items=["Піца","Вареники","Борщ","Суші","Шашлик","Млинці"];
  var theta=0,spinning=false,lastIdx=-1,soundOn=true,winner=-1;
  var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  var $=function(id){return document.getElementById(id)};
  var ac=null;

  function tickSound(f){
    if(!soundOn)return;
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      var o=ac.createOscillator(),g=ac.createGain();
      o.type="triangle";o.frequency.value=f||700;
      g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.08);
      o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.09);
    }catch(e){}
  }
  function fanfare(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tickSound(f)},i*110)})}

  function size(){
    var d=window.devicePixelRatio||1,w=cv.clientWidth;
    cv.width=w*d;cv.height=w*d;draw();
  }
  function draw(){
    var W=cv.width,R=W/2,n=items.length;
    ctx.clearRect(0,0,W,W);
    ctx.save();ctx.translate(R,R);
    // outer ring
    ctx.beginPath();ctx.arc(0,0,R*0.985,0,7);ctx.fillStyle="#0f3b8c";ctx.fill();
    ctx.lineWidth=R*0.02;ctx.strokeStyle="#f2b705";ctx.stroke();
    var r=R*0.93;
    if(!n){
      ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fillStyle="#223c70";ctx.fill();
      ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="600 "+R*0.07+"px sans-serif";
      ctx.fillText("Додайте варіанти",0,0);ctx.restore();return;
    }
    var s=Math.PI*2/n;
    ctx.rotate(theta);
    for(var i=0;i<n;i++){
      var c=COLORS[i%COLORS.length];
      if(n>1&&i===n-1&&i%COLORS.length===0)c=COLORS[1];
      ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,i*s,(i+1)*s);ctx.closePath();
      ctx.fillStyle=c[0];ctx.fill();
      ctx.lineWidth=R*0.008;ctx.strokeStyle="rgba(255,255,255,.55)";ctx.stroke();
      ctx.save();ctx.rotate(i*s+s/2);ctx.textAlign="right";ctx.textBaseline="middle";
      ctx.fillStyle=c[1];
      var fs=Math.max(R*0.055,Math.min(R*0.11,R*0.5*s*0.9));
      ctx.font="700 "+fs+"px 'Segoe UI',system-ui,sans-serif";
      var t=items[i],max=r*0.62;
      while(ctx.measureText(t).width>max&&t.length>2)t=t.slice(0,-2)+"…";
      ctx.fillText(t,r*0.9,0);ctx.restore();
    }
    // studs
    for(var k=0;k<n;k++){
      ctx.beginPath();ctx.arc(Math.cos(k*s)*r,Math.sin(k*s)*r,R*0.018,0,7);ctx.fillStyle="#f2b705";ctx.fill();
    }
    ctx.restore();
  }
  function idxAt(th){
    var n=items.length,s=Math.PI*2/n;
    var a=((-Math.PI/2-th)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
    return Math.floor(a/s)%n;
  }

  function renderList(){
    var ul=$("chips");ul.innerHTML="";
    items.forEach(function(t,i){
      var li=document.createElement("li");li.className="chip";
      var dot=document.createElement("i");dot.style.background=COLORS[i%COLORS.length][0];
      var sp=document.createElement("span");sp.textContent=t;
      var b=document.createElement("button");b.textContent="×";b.setAttribute("aria-label","Видалити");
      b.onclick=function(){if(spinning)return;items.splice(i,1);renderList();draw()};
      li.appendChild(dot);li.appendChild(sp);li.appendChild(b);ul.appendChild(li);
    });
    $("spin").disabled=items.length<2||spinning;
  }
  function addFromInput(){
    if(spinning)return;
    var v=$("inp").value.split(",").map(function(x){return x.trim()}).filter(Boolean);
    v.forEach(function(x){if(items.length<30)items.push(x)});
    $("inp").value="";renderList();draw();$("inp").focus();
  }
  $("add").onclick=addFromInput;
  $("inp").addEventListener("keydown",function(e){if(e.key==="Enter")addFromInput()});
  $("clear").onclick=function(){if(spinning)return;items=[];renderList();draw();$("result").textContent="Додайте варіанти та крутіть!"};
  $("shuffle").onclick=function(){if(spinning)return;for(var i=items.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=items[i];items[i]=items[j];items[j]=t}renderList();draw()};
  $("sound").onclick=function(){soundOn=!soundOn;this.textContent="Звук: "+(soundOn?"увімк.":"вимк.")};

  var hist=[];
  function addHist(t){
    hist.unshift(t);hist=hist.slice(0,10);
    var ol=$("hist");ol.innerHTML="";
    hist.forEach(function(h){var li=document.createElement("li");li.textContent=h;ol.appendChild(li)});
  }

  function ease(t){return 1-Math.pow(1-t,4)}
  function spin(){
    if(spinning||items.length<2)return;
    spinning=true;$("stage").classList.add("spinning");$("spin").disabled=true;$("result").textContent="Крутиться…";
    var n=items.length,s=Math.PI*2/n;
    winner=Math.floor(Math.random()*n);
    var jit=(Math.random()*0.8-0.4);
    var base=-Math.PI/2-(winner+0.5+jit)*s;
    var cur=theta%(Math.PI*2);
    var delta=((base-cur)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)+Math.PI*2*(6+Math.floor(Math.random()*3));
    var from=theta,dur=5200+Math.random()*1200,t0=performance.now();
    lastIdx=idxAt(theta);
    (function frame(now){
      var p=Math.min(1,(now-t0)/dur);
      theta=from+delta*ease(p);
      var i=idxAt(theta);
      if(i!==lastIdx){lastIdx=i;var pt=$("ptr");pt.classList.remove("tick");void pt.getBoundingClientRect();pt.classList.add("tick");tickSound(500+Math.random()*300)}
      draw();
      if(p<1)requestAnimationFrame(frame);else done();
    })(t0);
  }
  function done(){
    spinning=false;$("stage").classList.remove("spinning");
    var w=idxAt(theta);winner=w;
    $("result").textContent="Результат: "+items[w];
    addHist(items[w]);renderList();
    $("win").textContent=items[w];$("modal").classList.add("on");
    fanfare();confetti();
  }
  $("spin").onclick=spin;
  $("again").onclick=function(){$("modal").classList.remove("on");spin()};
  $("drop").onclick=function(){$("modal").classList.remove("on");items.splice(winner,1);renderList();draw();$("result").textContent="Варіант прибрано"};
  $("modal").addEventListener("click",function(e){if(e.target===this)this.classList.remove("on")});

  // confetti
  var fx=$("fx"),fc=fx.getContext("2d"),parts=[],raf=0;
  function confetti(){
    fx.width=innerWidth;fx.height=innerHeight;
    var cols=["#0057b7","#ffd700","#ffffff","#f2b705","#5a8cff"];
    for(var i=0;i<140;i++)parts.push({x:innerWidth/2,y:innerHeight*0.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,g:.35,r:Math.random()*6+3,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[i%cols.length],l:110});
    if(!raf)loop();
  }
  function loop(){
    fc.clearRect(0,0,fx.width,fx.height);
    parts=parts.filter(function(p){return p.l>0});
    parts.forEach(function(p){
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.l--;
      fc.save();fc.translate(p.x,p.y);fc.rotate(p.a);fc.globalAlpha=Math.min(1,p.l/30);
      fc.fillStyle=p.c;fc.fillRect(-p.r,-p.r/2,p.r*2,p.r);fc.restore();
    });
    raf=parts.length?requestAnimationFrame(loop):0;
    if(!raf)fc.clearRect(0,0,fx.width,fx.height);
  }

  addEventListener("resize",size);
  renderList();size();
})();
</script>
</body>
</html>
